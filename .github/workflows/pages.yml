# site/ 폴더를 GitHub Pages(https://gapfuzz.github.io/Gapfuzz/)로 올린다.
# main에 site/가 바뀐 커밋이 올라오면 자동으로 다시 배포된다. 수동 실행도 가능(Actions 탭 → Run workflow).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 올릴 파일만 모으기
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
